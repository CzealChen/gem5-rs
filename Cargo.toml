[package]
name = "gem5-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "gem5rs"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
object = { version = "0.38", default-features = false, features = ["read_core", "elf", "std", "unaligned"] }
pyo3 = { version = "0.28.3", optional = true }
riscv-isa = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
