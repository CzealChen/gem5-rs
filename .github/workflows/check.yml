name: simulator checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Baselines, installed AM package and real Spike probe
        run: nix run github:cachix/devenv/v2.2.2 -- shell -- just check-mvp check-am check-spike
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am-results
          path: target/am-results/*.json
          if-no-files-found: ignore
